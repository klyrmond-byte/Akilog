workflows:
  android-workflow:
    name: Akilog Android
    max_build_duration: 120
    environment:
      flutter: 3.47.5
    scripts:
      - name: Create Android project files
        script: |
          flutter create . --platforms=android
      - name: Get Flutter packages
        script: |
          flutter pub get
      - name: Build APK
        script: |
          flutter build apk --release
    artifacts:
      - build/app/outputs/flutter-apk/*.apk
